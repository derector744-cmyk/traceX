<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация — {{ app_name }}</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      obsidian: { bg:'#1e1e1e', panel:'#262626', panel2:'#2d2d2d', border:'#3a3a3a', accent:'#8875ff', accent2:'#a78bfa', text:'#dcddde', muted:'#9a9a9a' }
    }}}
  }
</script>
<style>
  body { background-color: #1e1e1e; }
  .tx-auth-blob {
    position: absolute; border-radius: 9999px; filter: blur(70px); opacity: .28; pointer-events: none;
  }
  input:focus { outline: none; border-color: #8875ff; }
</style>
{% include "_head_assets.html" %}
</head>
<body class="bg-obsidian-bg text-obsidian-text min-h-screen flex flex-col">

  {% include "_nav.html" %}

  <main class="flex-1 relative flex items-center justify-center px-4 py-16 overflow-hidden">
    <div class="tx-auth-blob tx-float w-72 h-72 bg-obsidian-accent -top-10 -right-10"></div>
    <div class="tx-auth-blob tx-float w-72 h-72 bg-purple-500 bottom-0 -left-10" style="animation-delay: -2.5s;"></div>

    <div class="relative w-full max-w-sm tx-fade-up">
      <div class="text-center mb-6">
        <span class="text-3xl font-bold tracking-tight tx-brand">trace<span class="text-white">X</span></span>
        <p class="text-sm text-obsidian-muted mt-1">Создание аккаунта</p>
      </div>

      <form method="post" action="/register" class="bg-obsidian-panel border border-obsidian-border rounded-xl p-6 space-y-4 shadow-xl">
        {% if error %}
        <div class="bg-red-950 border border-red-700 text-red-300 text-sm rounded-lg px-3 py-2 tx-scale-in">{{ error }}</div>
        {% endif %}

        <div>
          <label class="block text-xs text-obsidian-muted mb-1">Имя пользователя *</label>
          <input name="username" type="text" required autofocus minlength="3" placeholder="your_login" value="{{ form_username or '' }}"
            class="w-full bg-obsidian-panel2 border border-obsidian-border rounded-md px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs text-obsidian-muted mb-1">Email (необязательно)</label>
          <input name="email" type="email" placeholder="you@example.com" value="{{ form_email or '' }}"
            class="w-full bg-obsidian-panel2 border border-obsidian-border rounded-md px-3 py-2 text-sm">
        </div>
        <div>
          <label class="block text-xs text-obsidian-muted mb-1">Пароль *</label>
          <input id="f-password" name="password" type="password" required minlength="6" placeholder="Минимум 6 символов"
            class="w-full bg-obsidian-panel2 border border-obsidian-border rounded-md px-3 py-2 text-sm">
          <div class="h-1 bg-obsidian-panel2 rounded mt-1.5 overflow-hidden">
            <div id="password-strength-bar" class="tx-strength-bar" style="width:0%"></div>
          </div>
          <div id="password-strength-label" class="text-[11px] text-obsidian-muted mt-1 h-3"></div>
        </div>
        <div>
          <label class="block text-xs text-obsidian-muted mb-1">Повторите пароль *</label>
          <input name="confirm_password" type="password" required minlength="6" placeholder="Ещё раз пароль"
            class="w-full bg-obsidian-panel2 border border-obsidian-border rounded-md px-3 py-2 text-sm">
        </div>

        <button type="submit" class="tx-btn tx-btn-accent w-full py-2 rounded-md text-sm font-semibold bg-obsidian-accent hover:bg-obsidian-accent2 text-white transition">
          Зарегистрироваться
        </button>

        <p class="text-center text-xs text-obsidian-muted">
          Уже есть аккаунт? <a href="/login" class="text-obsidian-accent2 tx-link-underline">Войдите</a>
        </p>
      </form>
    </div>
  </main>

  <footer class="border-t border-obsidian-border py-4 text-center text-xs text-obsidian-muted">
    {{ app_name }} — форум расследований с графом связей в стиле Obsidian. Автор: {{ app_author }}.
  </footer>
{% include "_footer_assets.html" %}
</body>
</html>
