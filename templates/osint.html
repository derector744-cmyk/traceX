<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>OSINT каталог — {{ app_name }}</title><script src="https://cdn.tailwindcss.com"></script><script>tailwind.config={theme:{extend:{colors:{obsidian:{bg:'#080911',panel:'#111320',panel2:'#191b2b',border:'#2b2f46',accent:'#8875ff',accent2:'#a78bfa',text:'#eef0ff',muted:'#9aa0bd'}}}}}</script>{% include "_head_assets.html" %}</head><body class="bg-obsidian-bg text-obsidian-text min-h-screen">{% include "_nav.html" %}<main class="max-w-7xl mx-auto px-4 py-10"><div class="mb-8"><div class="text-obsidian-accent2 text-sm mb-2">🧰 OSINT NAVIGATOR</div><h1 class="text-4xl lg:text-6xl font-black">Каталог инструментов для расследований</h1><p class="text-obsidian-muted mt-4 max-w-3xl">Подборка сервисов по направлениям: номера, email, usernames, домены, крипта, изображения, архивы и соцсети. Используй только легальные методы и открытые источники.</p></div><input id="osintSearch" oninput="filterOsint()" class="w-full rounded-2xl bg-obsidian-panel border border-obsidian-border px-5 py-4 mb-6 outline-none focus:border-obsidian-accent" placeholder="Поиск: номер, telegram, email, домен, фото..."><div id="catalog" class="grid md:grid-cols-2 xl:grid-cols-3 gap-4"></div></main><script>const data=[['📱 OSINT номера',['Truecaller','GetContact','NumVerify','PhoneInfoga','Sync.me','Telegram import check'],'Проверка принадлежности номера, спам-метки, регион, возможные аккаунты.'],['👤 Username',['WhatsMyName','Sherlock','Maigret','Namechk','Social Analyzer','IDCrawl'],'Поиск ника по соцсетям, форумам и сервисам.'],['✉️ Email',['HaveIBeenPwned','Epieos','Hunter.io','EmailRep','Holehe','DeHashed'],'Утечки, репутация email, связанные аккаунты.'],['🌐 Домены/IP',['Whois','SecurityTrails','Shodan','Censys','crt.sh','DNSdumpster'],'WHOIS, DNS, сертификаты, инфраструктура, открытые порты.'],['🖼️ Фото/лица',['Google Lens','Yandex Images','TinEye','PimEyes','ExifTool','FotoForensics'],'Обратный поиск изображений, EXIF, следы монтажа.'],['💬 Telegram',['TGStat','Telemetr','Lyzem','Commentgram','TgDetective','@username search'],'Каналы, чаты, упоминания, история username.'],['₿ Крипта',['Blockchain.com Explorer','Etherscan','Tronscan','BTCscan','Arkham','Breadcrumbs'],'Адреса, транзакции, связи кошельков.'],['🗃️ Архивы',['Wayback Machine','archive.today','CachedView','Ghostarchive','Memento','oldweb.today'],'Старые версии страниц и удалённый контент.'],['🧾 Документы',['Google dorks','DocFetcher','PDF metadata','FOCA','VirusTotal','Maltego CE'],'Поиск документов, метаданные, связи.'],['🗺️ Гео',['Google Maps','Yandex Maps','OpenStreetMap','Wikimapia','SunCalc','GeoGuessr tools'],'Геолокация фото, тени, места, маршруты.'],['🏢 Компании',['OpenCorporates','Rusprofile','СПАРК аналоги','Crunchbase','LinkedIn','Контур.Фокус'],'Юрлица, руководители, связи компаний.'],['🛡️ Безопасность',['VirusTotal','URLScan','AbuseIPDB','PhishTank','Hybrid Analysis','Any.run'],'Проверка ссылок, файлов, IP и доменов.']];function render(list){catalog.innerHTML=list.map(x=>`<div class="tx-card rounded-2xl bg-obsidian-panel border border-obsidian-border p-5"><h3 class="text-xl font-bold mb-2">${x[0]}</h3><p class="text-sm text-obsidian-muted mb-4">${x[2]}</p><div class="flex flex-wrap gap-2">${x[1].map(s=>`<span class="px-2.5 py-1 rounded-lg bg-obsidian-panel2 border border-obsidian-border text-xs">${s}</span>`).join('')}</div></div>`).join('')}function filterOsint(){const q=osintSearch.value.toLowerCase();render(data.filter(x=>(x[0]+' '+x[1].join(' ')+' '+x[2]).toLowerCase().includes(q)))}render(data)</script></body></html>
